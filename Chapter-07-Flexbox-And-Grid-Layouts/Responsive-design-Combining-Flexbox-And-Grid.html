<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Layout with Flexbox and Grid</title>
  <style>

    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f4f8;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Flex container for responsive wrapping */
    .flex-grid-container {
      display: flex;
      /* Allow items to wrap to the next line */
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    /* Flex items with internal grid layout */
    .flex-grid-item {
      /* Grow, shrink, base size */
      flex: 1 1 200px;
      margin: 10px;
      background-color: lightblue;
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: 10px;
    }

    .grid-box {
      background-color: white;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

  </style>
</head>
<body>
  <h1>Responsive Layout with Flexbox + Grid</h1>
  <div class="flex-grid-container">
    <div class="flex-grid-item">
      <div class="grid-box">Item 1A</div>
      <div class="grid-box">Item 1B</div>
      <div class="grid-box">Item 1C</div>
      <div class="grid-box">Item 1D</div>
    </div>
    <div class="flex-grid-item">
      <div class="grid-box">Item 2A</div>
      <div class="grid-box">Item 2B</div>
      <div class="grid-box">Item 2C</div>
      <div class="grid-box">Item 2D</div>
    </div>
    <div class="flex-grid-item">
      <div class="grid-box">Item 3A</div>
      <div class="grid-box">Item 3B</div>
      <div class="grid-box">Item 3C</div>
      <div class="grid-box">Item 3D</div>
    </div>
    <div class="flex-grid-item">
      <div class="grid-box">Item 4A</div>
      <div class="grid-box">Item 4B</div>
      <div class="grid-box">Item 4C</div>
      <div class="grid-box">Item 4D</div>
    </div>
  </div>
</body>
</html>
