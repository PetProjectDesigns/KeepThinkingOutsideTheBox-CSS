<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Flexbox with Media Queries</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f4f8;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }
    .flex-grid-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .flex-grid-item {
      flex: 1 1 200px;
      background-color: lightblue;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    @media (min-width: 600px) {
      .flex-grid-container {
        flex-direction: row;
      }
    }
    @media (max-width: 599px) {
      .flex-grid-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <h1>Responsive Layout with Media Queries</h1>
  <div class="flex-grid-container">
    <div class="flex-grid-item">Item 1</div>
    <div class="flex-grid-item">Item 2</div>
    <div class="flex-grid-item">Item 3</div>
    <div class="flex-grid-item">Item 4</div>
  </div>
</body>
</html>
