<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inline vs External CSS</title>

<link rel="stylesheet" href="styles.css">
<style>
  .class-style {
    color: green;
    font-size: 1.2rem;
  }
</style>
</head>

<body>

<h1>Inline vs External CSS</h1>

<p style="color: red; font-size: 20px;">This paragraph uses inline styles.</p>

<p class="class-style">This paragraph uses a class.</p>

<p class="external-style">This paragraph uses external CSS.</p>

</body>
</html>
