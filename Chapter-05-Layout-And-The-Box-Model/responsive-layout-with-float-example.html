<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Responsive Layout</title>
  <style>
    .container {
      width: 100%;
    }

    .column {
      float: left;
      width: 50%;
      padding: 20px;
      box-sizing: border-box;
    }

    .column:nth-child(1) {
      background-color: lightblue;
    }

    .column:nth-child(2) {
      background-color: lightcoral;
    }

    @media (max-width: 600px) {
      .column {
        width: 100%;
        float: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="column">
      <h2>Column 1</h2>
      <p>This is the first column. On larger screens, it sits next to Column 2. On smaller screens, it stacks above Column 2.</p>
    </div>
    <div class="column">
      <h2>Column 2</h2>
      <p>This is the second column. Resize your browser window to see how the layout changes when the width is 600px or less.</p>
    </div>
  </div>
</body>
</html>
