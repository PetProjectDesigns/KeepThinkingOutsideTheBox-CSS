<!DOCTYPE html>
<html>
<head>
  <style>
    /* Align text to the center */
    p {
      text-align: center;
    }

    /* Change line height */
    p {
      line-height: 1.5;
    }

    /* Change letter spacing */
    p {
      letter-spacing: 2px;
    }

    /* Change word spacing */
    p {
      word-spacing: 5px;
    }

    /* Add text decoration (underline) */
    a {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Text Styling Demo</h1>

  <p>
    This paragraph demonstrates text alignment, spacing, and letter spacing.
    Notice how the text is centered, spaced out, and easier to read.
  </p>

  <p>
    Visit <a href="#">this link</a> to see the underline decoration in action.
  </p>

</body>
</html>
