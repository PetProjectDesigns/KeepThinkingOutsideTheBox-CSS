<!DOCTYPE html>
<html>
<head>
  <!-- Link to Google Fonts in the HTML file -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">

  <style>
    /* Use the Google Font in CSS */
    body {
      font-family: "Roboto", sans-serif;
      padding: 20px;
    }

    h1 {
      font-weight: 700; /* Uses Roboto Bold */
    }

    p {
      font-weight: 400; /* Uses Roboto Regular */
    }
  </style>
</head>
<body>

  <h1>Google Fonts Demo (Roboto)</h1>

  <p>
    This paragraph is using the Roboto font loaded from Google Fonts.
    The browser downloads the font from Google's servers and applies it to the page.
  </p>

</body>
</html>
