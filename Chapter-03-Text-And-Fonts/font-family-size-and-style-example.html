<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      /* Base font for the page */
      font-family: Arial, sans-serif;
    }

    h1 {
      /* Larger heading size */
      font-size: 32px;
      /* Italic heading */
      font-style: italic;
    }

    p {
      /* Paragraph text size */
      font-size: 18px;
    }

    .emphasis {
      /* Italic text */
      font-style: italic;
    }

    .strong {
      /* Bold text */
      font-weight: bold;
    }

    .smallcaps {
      /* Small-caps style */
      font-variant: small-caps;
    }
  </style>
</head>
<body>

  <h1>Font Styling Demo</h1>

  <p>This paragraph uses the base font and size.</p>

  <p class="emphasis">This paragraph is italic using <code>font-style: italic;</code></p>

  <p class="strong">This paragraph is bold using <code>font-weight: bold;</code></p>

  <p class="smallcaps">This paragraph uses small-caps with <code>font-variant: small-caps;</code></p>

</body>
</html>
