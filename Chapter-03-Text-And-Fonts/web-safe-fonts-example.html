<!DOCTYPE html>
<html>
<head>
  <style>
    /* Use a web-safe font */
    body {
      font-family: "Arial", "Helvetica", sans-serif;
    }
  </style>
</head>
<body>

  <h1>Web‑Safe Font Demo</h1>

  <p>
    This page uses a web‑safe font stack: Arial → Helvetica → sans‑serif.
    If the browser can’t load Arial, it will fall back to Helvetica, and then to a generic sans‑serif font.
  </p>

</body>
</html>
