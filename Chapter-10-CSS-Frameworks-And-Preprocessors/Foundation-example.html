<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Adding Foundation to your project -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/foundation/6.6.3/css/foundation.min.css">

  <title>Foundation Demo</title>
</head>
<body class="grid-container">

  <h1 class="text-center">Foundation Demo</h1>

  <!-- Foundation Callout -->
  <div class="callout primary">
    <h5>Welcome!</h5>
    <p>This is a simple Foundation callout component.</p>
  </div>

  <!-- Foundation Button -->
  <h3>Foundation Button</h3>
  <button class="button success">Click Me</button>

  <!-- Foundation Grid -->
  <h3 class="margin-top-2">Foundation Grid Example</h3>
  <div class="grid-x grid-margin-x text-center">
    <div class="cell small-12 medium-4">
      <div class="callout">Column 1</div>
    </div>
    <div class="cell small-12 medium-4">
      <div class="callout">Column 2</div>
    </div>
    <div class="cell small-12 medium-4">
      <div class="callout">Column 3</div>
    </div>
  </div>

  <!-- Optional Foundation JS (not required for this demo) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/foundation/6.6.3/js/foundation.min.js"></script>
  <script>
    $(document).foundation();
  </script>

</body>
</html>
