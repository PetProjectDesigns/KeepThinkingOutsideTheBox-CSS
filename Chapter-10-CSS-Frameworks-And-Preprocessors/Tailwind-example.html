<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Adding Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Tailwind CSS Demo</title>
</head>
<body class="bg-gray-100 p-6">

  <h1 class="text-3xl font-bold text-center mb-6">
    Tailwind CSS Demo
  </h1>

  <!-- Tailwind Button -->
  <h2 class="text-xl font-semibold mb-2">Tailwind Button</h2>
  <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
    Click Me
  </button>

  <!-- Tailwind Card -->
  <h2 class="text-xl font-semibold mt-8 mb-2">Tailwind Card</h2>
  <div class="max-w-sm bg-white p-4 rounded shadow">
    <h3 class="text-lg font-bold mb-2">Card Title</h3>
    <p class="text-gray-700 mb-4">
      This is a simple card built using Tailwind utility classes.
    </p>
    <a href="#" class="text-blue-500 hover:underline">Learn More</a>
  </div>

  <!-- Tailwind Flexbox Example -->
  <h2 class="text-xl font-semibold mt-8 mb-2">Flexbox Example</h2>
  <div class="flex gap-4">
    <div class="bg-red-400 text-white p-4 rounded flex-1 text-center">Box 1</div>
    <div class="bg-green-400 text-white p-4 rounded flex-1 text-center">Box 2</div>
    <div class="bg-blue-400 text-white p-4 rounded flex-1 text-center">Box 3</div>
  </div>

  <!-- Tailwind Responsive Grid -->
  <h2 class="text-xl font-semibold mt-8 mb-2">Responsive Grid</h2>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="bg-purple-400 text-white p-4 rounded text-center">Column 1</div>
    <div class="bg-purple-500 text-white p-4 rounded text-center">Column 2</div>
    <div class="bg-purple-600 text-white p-4 rounded text-center">Column 3</div>
  </div>

</body>
</html>
