<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Adding Bootstrap to your project -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <title>Bootstrap Demo</title>
</head>
<body class="p-4">

  <div class="container">
    <h1 class="text-center mb-4">Bootstrap Demo</h1>

    <!-- Bootstrap Button -->
    <h3>Bootstrap Button</h3>
    <button class="btn btn-primary mb-4">Click Me</button>

    <!-- Bootstrap Card -->
    <h3>Bootstrap Card</h3>
    <div class="card mb-4" style="max-width: 300px;">
      <div class="card-body">
        <h5 class="card-title">Card Title</h5>
        <p class="card-text">This is a simple Bootstrap card component.</p>
        <a href="#" class="btn btn-success">Learn More</a>
      </div>
    </div>

    <!-- Bootstrap Grid -->
    <h3>Bootstrap Grid Example</h3>
    <div class="row text-white">
      <div class="col-md-4 p-3 bg-primary">Column 1</div>
      <div class="col-md-4 p-3 bg-info">Column 2</div>
      <div class="col-md-4 p-3 bg-secondary">Column 3</div>
    </div>
  </div>

  <!-- Optional Bootstrap JS (not required for this demo) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
