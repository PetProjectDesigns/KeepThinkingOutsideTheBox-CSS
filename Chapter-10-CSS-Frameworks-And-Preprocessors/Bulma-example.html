<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Adding Bulma CSS via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

  <title>Bulma CSS Demo</title>
</head>
<body>

  <!-- Bulma Hero Section -->
  <section class="hero is-primary">
    <div class="hero-body">
      <p class="title">Bulma CSS Demo</p>
      <p class="subtitle">A simple example using Bulma components</p>
    </div>
  </section>

  <div class="section">
    <div class="container">

      <!-- Bulma Button -->
      <h2 class="title is-4">Bulma Button</h2>
      <button class="button is-link">Click Me</button>

      <!-- Bulma Card -->
      <h2 class="title is-4 mt-5">Bulma Card</h2>
      <div class="card" style="max-width: 300px;">
        <div class="card-content">
          <p class="title is-5">Card Title</p>
          <p>This is a simple Bulma card component.</p>
        </div>
      </div>

      <!-- Bulma Columns -->
      <h2 class="title is-4 mt-5">Bulma Columns Example</h2>
      <div class="columns">
        <div class="column has-background-info has-text-white p-4">Column 1</div>
        <div class="column has-background-success has-text-white p-4">Column 2</div>
        <div class="column has-background-warning has-text-white p-4">Column 3</div>
      </div>

    </div>
  </div>

</body>
</html>
