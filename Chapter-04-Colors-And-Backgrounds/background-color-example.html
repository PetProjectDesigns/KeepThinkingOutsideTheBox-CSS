<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Background Color Example</title>

  <style>
    body {
      background-color: #f0f0f0; /* Light gray background */
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 6px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Light Gray Background Demo</h1>
    <p>
      This page uses a light gray background color applied to the <code>body</code> element.
      The white box helps show the contrast between the background and the content area.
    </p>
  </div>

</body>
</html>
