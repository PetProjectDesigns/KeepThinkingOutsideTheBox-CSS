<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Radial Gradient Example</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }

    .radial-gradient {
      background: radial-gradient(circle, #ff5733, #ffbd33); /* Orange to yellow radial gradient */
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
      border-radius: 8px;
      margin: 20px;
    }

    .info {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }
  </style>
</head>
<body>

  <div class="radial-gradient">
    Radial Gradient: Orange to Yellow
  </div>

  <div class="info">
    <p>
      The box above uses a radial gradient background that starts with orange (#ff5733) at the center
      and fades outward to yellow (#ffbd33). This is done using the <code>radial-gradient</code> function in CSS.
    </p>
  </div>

</body>
</html>
