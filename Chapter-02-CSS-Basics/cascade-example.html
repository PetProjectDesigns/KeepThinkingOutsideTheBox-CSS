<!DOCTYPE html>
<html>
<head>
  <style>
    p {
      color: red; /* Base rule */
    }

    .highlight {
      color: blue; /* More specific rule overrides the base */
    }
  </style>
</head>
<body>

  <p>This paragraph is red because it uses the general p selector.</p>

  <p class="highlight">This paragraph is blue because the .highlight class overrides the p rule.</p>

</body>
</html>
