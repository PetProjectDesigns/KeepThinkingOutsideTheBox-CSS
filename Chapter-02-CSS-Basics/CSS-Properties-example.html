<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #f0f0f0;
    }

    h1 {
      font-family: Arial, sans-serif;
      font-size: 24px;
    }

    p {
      color: blue;
      text-align: center;
    }

    div {
      margin: 20px;
      padding: 10px;
      background-color: white;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <h1>CSS Properties Demo</h1>

  <div>
    <p>This paragraph is blue and centered.</p>
    <p>The div around it has margin and padding.</p>
  </div>

</body>
</html>
